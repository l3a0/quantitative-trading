[project]
name = "quantitative-trading"
version = "0.0.0"
description = "Experiments and replications from Ernest Chan's quantitative trading books."
readme = "README.md"
requires-python = ">=3.12"
# The replications compute their numbers through statsmodels rather than a
# hand-rolled least squares, so there is one implementation of each estimator
# to drift from. numpy and pandas load and align the committed vintages; scipy
# supplies the t-distribution behind the return-correlation significance test.
dependencies = [
    "numpy>=2",
    "pandas>=2",
    "scipy>=1.13",
    "statsmodels>=0.14",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/chan"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Puts the repo root on the path, so a test can import both the package under
# src/ and the helpers under tests/support/.
pythonpath = ["."]
addopts = "-ra"

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
