name: Board

# Copied into l3a0/quantitative-trading from .github/workflows/board.yml in
# l3a0/repo-template at commit cf2959a3e48aeec3d71a6ade5fc9641fc9e82073,
# the merge of l3a0/repo-template#43, which follows the merge of
# l3a0/repo-template#42 that added the data-label input. Apart from this
# paragraph, the only changes are the ref on the `uses:` line, pinned to that
# commit, and the `with:` block naming this board's title and the label that
# marks a card waiting on data. In the comments below, "here" and "the
# template itself" mean l3a0/repo-template. To take a later fix, move the ref.
# The board's skills come from the owner's l3a0 Claude Code plugin rather than
# from copies in this repository, and the Generator compatibility section of
# its update-build-board skill says when a moved ref also needs a plugin
# release.
#
# Until issue 785 this repository ran its own generator and page, which the
# template's were ported from. Issue 532 built them, issue 533 moved the
# board's judgement onto labels, links and lines, and issue 587 measured the
# schedule this file's cron line keeps.
#
# Starts the build board's rebuild, which the reusable workflow
# .github/workflows/build-board.yml in l3a0/repo-template carries out. A
# repository seeded from the template copies this file unchanged except for the
# ref on the `uses:` line, which it pins to a full commit SHA of
# l3a0/repo-template, and a `with:` block for the inputs it sets, such as
# `title` or `icon`. The template itself calls `main`, so its own board runs
# the shared path before any seeded repository pins it.
#
# Provenance: the triggers, permissions and concurrency group of
# .github/workflows/board.yml in l3a0/quantitative-trading at commit 6da0ee3,
# landed here by the pull request that closes l3a0/repo-template#24. The jobs
# moved into the reusable workflow, and the job here grants the scopes both of
# them need, because a called workflow can only narrow what its caller grants.
#
# A label, a body edit or a comment starts a run through `issues` and
# `issue_comment`. A "blocked by" link and a sub-issue start none, because
# GitHub Actions lists no trigger for either, so the session that sets one
# dispatches this workflow on main through workflow_dispatch. The l3a0
# plugin's update-build-board skill names the command and the moments that
# need it.
#
# Every trigger below except workflow_dispatch fires only once this file is on
# main, and every one of them runs on the default branch, which is the only
# branch the github-pages environment lets deploy. Since 2025-12-08 that holds
# for pull_request_target too, whatever a pull request's base, as GitHub's
# changelog of 2025-11-07 states. Its filter admits only pull requests into
# main, because GitHub registers a closing link only on a pull request into
# the default branch. One into another base still reaches the board, through
# its Part of line, on the next run of any kind. pull_request and
# pull_request_review run on a merge ref instead, and check_suite never fires
# for a suite GitHub Actions created, so neither is here.
#
# The reusable workflow checks out no pull request's code, no step reads the
# event payload, and every action it runs is named by a commit SHA, which its
# own header explains.
on:
  issues:
  issue_comment:
  # Its default types are opened, synchronize and reopened. A merged Part of
  # pull request closes no issue, so without `closed` it would read as open
  # until the cron run, and without `edited` so would a corrected closing link.
  pull_request_target:
    branches: [main]
    types: [opened, synchronize, reopened, closed, edited]
  # The only event that fires when ci.yml's checks settle. CodeQL's default
  # setup has no workflow file here, so its result reaches the board on the
  # next run of any kind.
  workflow_run:
    workflows: [CI]
    types: [completed]
  # Catches a change made with a workflow's own token, which starts no run,
  # and a dispatch a session forgot. Nothing can rely on it, because GitHub
  # delays or drops a scheduled run under load: one measurement of this
  # schedule saw about 11% of its slots fire over 185 hours, with up to 603
  # minutes between two runs. The generator reads this line, and the page
  # calls the board stale once it is older than the longest gap between two
  # runs plus SCHEDULE_DELAY_ALLOWANCE in scripts/build_board.py, so changing
  # the line here moves the threshold too. Off the hour, because the top of
  # the hour is when GitHub is busiest.
  schedule:
    - cron: "8,38 * * * *"
  workflow_dispatch:

permissions: {}

# Runs deploy one at a time, so an older snapshot never replaces a newer one.
# GitHub keeps only the newest waiting run, which is the one worth deploying.
# The group lives here beside the triggers, so every run of the caller shares
# it whichever event started it.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  board:
    # The union of the scopes the reusable workflow's two jobs declare. Each
    # of its jobs narrows this to what it uses.
    permissions:
      contents: read
      issues: read
      pull-requests: read
      checks: read
      statuses: read
      pages: write
      id-token: write
      actions: read
    uses: l3a0/repo-template/.github/workflows/build-board.yml@cf2959a3e48aeec3d71a6ade5fc9641fc9e82073
    with:
      title: Quantitative Trading Build Board
      data-label: blocked-on-data
